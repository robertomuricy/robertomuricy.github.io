<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixe o AstroQuiz</title>
<meta name="description" content="Quiz de astronomia com mais de 700 perguntas em 50 fases. Grátis no iPhone e no Android.">
<link rel="canonical" href="https://playastroquiz.com/baixar/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://playastroquiz.com/baixar/">
<meta property="og:title" content="AstroQuiz: quiz de astronomia">
<meta property="og:description" content="Mais de 700 perguntas em 50 fases. Grátis no iPhone e no Android.">
<meta property="og:image" content="https://playastroquiz.com/baixar/icone.png">
<script>
  // Leva direto para a loja certa. Quem não está num celular (ou abriu com
  // ?ficar) vê a página com os dois botões.
  (function () {
    var IOS = "https://apps.apple.com/br/app/id6759288097";
    var PLAY = "https://play.google.com/store/apps/details?id=com.astroquiz.app";

    // ?o=instagram vira a origem da instalação no relatório de aquisição da Play.
    var params = new URLSearchParams(location.search);
    var origem = (params.get("o") || "site").toLowerCase();
    if (!/^[a-z0-9_-]{1,30}$/.test(origem)) origem = "site";
    var playComOrigem = PLAY + "&referrer=" +
      encodeURIComponent("utm_source=" + origem + "&utm_medium=link");

    window.LOJAS = { ios: IOS, android: playComOrigem };
    if (params.has("ficar")) return;

    // Android primeiro: o iPad se apresenta como Mac com tela de toque, e esse
    // teste não pode capturar um Android.
    var ua = navigator.userAgent || "";
    var iPadComoMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    if (/Android/i.test(ua)) location.replace(playComOrigem);
    else if (/iPhone|iPad|iPod/.test(ua) || iPadComoMac) location.replace(IOS);
  })();
</script>
<style>
  :root {
    --fundo: #0b0b1a;
    --cartao: #1c1c2e;
    --texto: #f2f2f7;
    --suave: #a9a9bd;
    --destaque: #ffa726;
    --borda: #2c2c44;
  }
  * { box-sizing: border-box; }
  html { background: var(--fundo); }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1rem;
    color: var(--texto);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255, 167, 38, .14), transparent 60%),
      radial-gradient(1px 1px at 12% 18%, #fff8, transparent),
      radial-gradient(1px 1px at 78% 12%, #fff9, transparent),
      radial-gradient(1.5px 1.5px at 32% 72%, #fff7, transparent),
      radial-gradient(1px 1px at 88% 64%, #fff8, transparent),
      radial-gradient(1px 1px at 55% 40%, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 8% 86%, #fff8, transparent),
      radial-gradient(1px 1px at 66% 90%, #fff7, transparent),
      var(--fundo);
  }
  main { width: 100%; max-width: 26rem; text-align: center; }
  .icone {
    width: 112px; height: 112px; margin: 0 auto 1.5rem;
    border-radius: 22%;
    background: url(icone.png) center / 113% no-repeat;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .45);
  }
  h1 { font-size: 2rem; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--suave); margin: .5rem 0 2rem; }
  .lojas { display: grid; gap: .75rem; }
  .loja {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    padding: 1rem 1.25rem;
    border: 1px solid var(--borda); border-radius: .9rem;
    background: var(--cartao); color: var(--texto);
    font-weight: 600; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .loja:hover, .loja:focus-visible { border-color: var(--destaque); transform: translateY(-1px); }
  .loja svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
  .loja small { display: block; color: var(--suave); font-weight: 400; font-size: .78rem; line-height: 1.2; }
  .loja span { text-align: left; }
  footer { margin-top: 2.5rem; color: var(--suave); font-size: .85rem; }
  footer a { color: var(--destaque); }
</style>
</head>
<body>
<main>
  <div class="icone" role="img" aria-label="Ícone do AstroQuiz"></div>
  <h1>AstroQuiz</h1>
  <p class="sub">Quiz de astronomia com mais de 700 perguntas em 50 fases. Grátis.</p>

  <div class="lojas">
    <a class="loja" id="ios" href="https://apps.apple.com/br/app/id6759288097">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.97-3.46-1.07-1.57-2.74-1.78-3.33-1.8-1.42-.14-2.77.83-3.49.83-.72 0-1.83-.81-3.01-.79-1.55.02-2.98.9-3.78 2.29-1.61 2.8-.41 6.94 1.16 9.21.77 1.11 1.68 2.36 2.88 2.31 1.16-.05 1.59-.75 2.99-.75 1.4 0 1.79.75 3.01.72 1.24-.02 2.03-1.13 2.79-2.25.88-1.29 1.24-2.53 1.26-2.6-.03-.01-2.42-.93-2.45-3.71zM14.08 5.85c.64-.77 1.07-1.85.95-2.92-.92.04-2.03.61-2.69 1.38-.59.68-1.11 1.78-.97 2.83 1.02.08 2.07-.52 2.71-1.29z"/></svg>
      <span><small>Baixar na</small>App Store</span>
    </a>
    <a class="loja" id="android" href="https://play.google.com/store/apps/details?id=com.astroquiz.app">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8c-.3.3-.5.8-.5 1.4v17.6c0 .6.2 1.1.5 1.4l.1.1L13.5 12v-.2L3.7 1.7l-.1.1zM16.8 15.3l-3.3-3.3v-.2l3.3-3.3.1.1 3.9 2.2c1.1.6 1.1 1.7 0 2.3l-3.9 2.2h-.1zM16.9 15.2L13.5 11.9 3.6 21.8c.4.4 1 .4 1.7.1l11.6-6.7M16.9 8.6L5.3 1.9c-.7-.4-1.3-.3-1.7.1l9.9 9.9 3.4-3.3z"/></svg>
      <span><small>Disponível no</small>Google Play</span>
    </a>
  </div>

  <footer>Dúvidas? Veja a <a href="/">página de suporte</a>.</footer>
</main>
<script>
  // Os botões também levam a origem (?o=...) para a Play.
  if (window.LOJAS) document.getElementById("android").href = window.LOJAS.android;
</script>
</body>
</html>
